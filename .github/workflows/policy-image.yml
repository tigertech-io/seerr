name: Policy image

on:
  push:
    tags:
      - v3.3.0-policy.*
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  IMAGE: ghcr.io/tigertech-io/seerr

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Scan source with Gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source=/repo \
              --log-opts="703faf95f454ffecae99a5e86ea761b3b524c6df..HEAD" \
              --redact --no-banner

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_TAG=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:3.3.0-policy.1
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Smoke-test published container
        run: |
          docker run --detach --name seerr-policy-smoke \
            --publish 5055:5055 \
            --env CONTENT_POLICY_CONFIG=/app/policy/policy.yml \
            --volume "$GITHUB_WORKSPACE/content-policy:/app/policy:ro" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5055/api/v1/status >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs seerr-policy-smoke
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force seerr-policy-smoke || true

      - uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: seerr-3.3.0-policy.1.spdx.json
          artifact-name: seerr-policy-sbom

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: 0

      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        with:
          name: seerr-policy-trivy
          path: trivy-results.sarif
          if-no-files-found: error

      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce vulnerability gate
        run: |
          findings=$(jq '[.runs[].results[]] | length' trivy-results.sarif)
          echo "High or critical fixed-vulnerability findings: $findings"
          test "$findings" -eq 0

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/seerr" \
            --field visibility=public
